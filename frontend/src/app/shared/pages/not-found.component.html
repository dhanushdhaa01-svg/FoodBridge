<div class="not-found-page">
  <h1>404</h1>
  <p>The page you are looking for does not exist.</p>
  @if (isAuthenticated()) {
    <button mat-raised-button color="primary" (click)="goToDashboard()">
      Go to Dashboard
    </button>
  } @else {
    <button mat-raised-button color="primary" (click)="goToLogin()">
      Go to Login
    </button>
  }
</div>
