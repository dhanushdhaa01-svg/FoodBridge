<div class="unauthorized-page">
  <div class="unauthorized-card">
    <div class="icon-wrap">
      <mat-icon>lock</mat-icon>
    </div>
    <h1>Access Restricted</h1>
    <p>You do not have the necessary security credentials or administrative privileges to view this section.</p>

    <div class="actions-row">
      <button mat-flat-button color="primary" class="return-btn" (click)="goBack()">
        <mat-icon>dashboard</mat-icon>
        <span>Return to Dashboard</span>
      </button>
    </div>
  </div>
</div>
