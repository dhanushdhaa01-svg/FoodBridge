<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title class="auth-title">Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email">
          <mat-error *ngIf="email?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="email?.hasError('email')">Please enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button" [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="password?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="password?.hasError('minlength')">Password must be at least 8 characters</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="submit-button" [disabled]="loginForm.invalid || isSubmitting()">
          <mat-spinner *ngIf="isSubmitting()" diameter="20" color="accent"></mat-spinner>
          <span *ngIf="!isSubmitting()">Login</span>
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions class="auth-actions">
      <p>Don't have an account? <a mat-button [routerLink]="appRoutes.REGISTER">Register</a></p>
    </mat-card-actions>
  </mat-card>
</div>
