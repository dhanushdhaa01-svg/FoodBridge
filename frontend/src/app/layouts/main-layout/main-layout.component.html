<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    class="sidenav"
    [attr.aria-label]="'Navigation menu'">
    
    <div class="sidenav-header">
      <span class="sidenav-logo">FoodBridge</span>
    </div>

    <mat-nav-list class="sidenav-nav">
      @for (item of visibleNavItems(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active"
          [attr.aria-label]="item.label">
          <mat-icon matListIcon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <mat-toolbar color="primary" class="toolbar">
      <button
        mat-icon-button
        (click)="toggleSidenav()"
        *ngIf="isMobile()"
        type="button"
        [attr.aria-label]="'Toggle navigation menu'">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">FoodBridge</span>
      <span class="toolbar-spacer"></span>
      @if (user(); as currentUser) {
        <span class="user-info">{{ currentUser.fullName }} ({{ currentUser.role }})</span>
      }
      <button
        mat-icon-button
        [matMenuTriggerFor]="profileMenu"
        type="button"
        [attr.aria-label]="'User menu'">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item (click)="onLogout()" type="button">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
